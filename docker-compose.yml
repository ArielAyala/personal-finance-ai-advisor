version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: financial-postgres
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_dev_password
      POSTGRES_DB: financial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  financial-network:
    driver: bridge
